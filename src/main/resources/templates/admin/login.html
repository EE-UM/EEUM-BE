<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>이음 관리자 로그인</title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}">
</head>
<body class="center">
<main class="card login">
    <h1>이음 관리자</h1>
    <p class="muted">허용된 카카오 계정으로만 로그인할 수 있습니다.</p>

    <p class="alert error" th:if="${param.error}">허용되지 않은 계정이거나 로그인에 실패했습니다.</p>
    <p class="alert" th:if="${param.logout}">로그아웃되었습니다.</p>

    <a class="button kakao" th:href="@{${kakaoLoginUrl}}">카카오로 로그인</a>
</main>
</body>
</html>
