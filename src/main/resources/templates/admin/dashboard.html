<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('대시보드')}"></head>
<body>
<header th:replace="~{admin/fragments/layout :: topbar('dashboard')}"></header>
<main class="content" th:with="d=${dashboard}">
    <h1>대시보드</h1>

    <section class="tiles">
        <div class="card tile">
            <div class="tile-label">전체 회원</div>
            <div class="tile-value" th:text="${#numbers.formatInteger(d.totalUsers, 1, 'COMMA')}">0</div>
            <div class="tile-note muted">게스트·탈퇴 포함</div>
        </div>
        <div class="card tile">
            <div class="tile-label">전체 게시글</div>
            <div class="tile-value" th:text="${#numbers.formatInteger(d.totalPosts, 1, 'COMMA')}">0</div>
            <div class="tile-note muted">삭제된 글 제외</div>
        </div>
        <div class="card tile">
            <div class="tile-label">완료된 게시글</div>
            <div class="tile-value" th:text="${#numbers.formatInteger(d.completedPosts, 1, 'COMMA')}">0</div>
            <div class="tile-note muted">삭제된 글 제외</div>
        </div>
        <div class="card tile">
            <div class="tile-label">신고로 삭제된 게시글</div>
            <div class="tile-value" th:text="${#numbers.formatInteger(d.reportDeletedPosts, 1, 'COMMA')}">0</div>
            <div class="tile-note muted">누적</div>
        </div>
    </section>

    <section class="card chart-card">
        <div class="chart-header">
            <h2>일별 신규 가입</h2>
            <span class="muted">
                최근 30일(KST) 합계
                <strong th:text="${#numbers.formatInteger(d.signUpsInPeriod(), 1, 'COMMA')}">0</strong>명
            </span>
        </div>

        <div class="chart" role="img"
             th:attr="aria-label='최근 30일 일별 신규 가입 수 막대 차트, 합계 ' + ${d.signUpsInPeriod()} + '명'">
            <div class="chart-y" aria-hidden="true">
                <span class="top" th:text="${d.chartMax()}">10</span>
                <span class="mid" th:if="${d.chartMax() % 2 == 0}" th:text="${d.chartMax() / 2}">5</span>
                <span class="zero">0</span>
            </div>
            <div class="chart-plot">
                <div class="chart-grid top"></div>
                <div class="chart-grid mid"></div>
                <div class="chart-bars">
                    <div class="bar-slot" tabindex="0" th:each="day : ${d.dailySignUps}"
                         th:attr="data-tip=${#temporals.format(day.date, 'M월 d일')} + ' · ' + ${day.count} + '명'">
                        <div class="bar" th:style="'height:' + ${d.barHeightPercent(day)} + '%'"></div>
                    </div>
                </div>
                <div class="chart-x">
                    <span th:each="day, stat : ${d.dailySignUps}"
                          th:text="${(stat.size - 1 - stat.index) % 7 == 0} ? ${#temporals.format(day.date, 'M/d')} : ''"></span>
                </div>
            </div>
        </div>

        <details class="chart-table">
            <summary>표로 보기</summary>
            <table>
                <thead>
                <tr>
                    <th>날짜</th>
                    <th class="num">가입 수</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="day : ${d.dailySignUps}">
                    <td th:text="${#temporals.format(day.date, 'yyyy-MM-dd (E)')}">2026-01-01</td>
                    <td class="num" th:text="${day.count}">0</td>
                </tr>
                </tbody>
            </table>
        </details>
    </section>
</main>
</body>
</html>
