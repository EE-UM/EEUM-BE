<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{web/fragments/layout :: assets}"></th:block>
    <title th:text="|${post.title} · 이음|">이음</title>
    <meta name="description" th:content="${post.description}">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="이음">
    <meta property="og:title" th:content="${post.title}">
    <meta property="og:description" th:content="${post.description}">
    <meta property="og:image" th:if="${post.artworkUrl}" th:content="${post.artworkUrl}">
    <meta name="twitter:card" content="summary">
</head>
<body>
<th:block th:replace="~{web/fragments/layout :: topbar}"></th:block>

<main class="page">
    <section class="hero">
        <img class="hero-art" th:if="${post.artworkUrl}" th:src="${post.artworkUrl}"
             th:alt="|${post.songName} 앨범 커버|">
        <button type="button" class="play play-lg" th:if="${post.previewUrl}"
                th:attr="data-src=${post.previewUrl}" aria-label="음악 재생">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
    </section>

    <div class="track">
        <span class="track-song" th:text="${post.songName}">곡 제목</span>
        <span class="track-artist" th:text="${post.artistName}">아티스트</span>
    </div>

    <h1 class="post-title" th:text="${post.title}">사연 제목</h1>
    <p class="post-content" th:text="${post.content}">사연 본문</p>

    <button type="button" class="view-toggle" data-view-toggle th:unless="${#lists.isEmpty(post.comments)}">
        <img class="when-grid" th:src="|${base}web/img/list.png|" width="20" height="20" alt="">
        <img class="when-list" th:src="|${base}web/img/musicbox.png|" width="20" height="20" alt="">
        <span class="when-grid">글보기</span>
        <span class="when-list">커버보기</span>
    </button>

    <section class="comments" data-mode="grid" aria-label="노래 댓글">
        <div class="comments-empty" th:if="${#lists.isEmpty(post.comments)}">
            <p>아직 도착한 노래가 없어요.</p>
            <p>이 사연에 어울리는 첫 번째 노래를 남겨 주세요.</p>
        </div>

        <div class="comment-grid">
            <article class="comment-card" th:each="comment : ${post.comments}">
                <div class="comment-cover">
                    <img th:if="${comment.artworkUrl}" th:src="${comment.artworkUrl}" alt="" loading="lazy">
                    <button type="button" class="play play-md" th:if="${comment.previewUrl}"
                            th:attr="data-src=${comment.previewUrl}" aria-label="음악 재생">
                        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
                        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
                    </button>
                </div>
                <p class="comment-song" th:if="${comment.songName}" th:text="${comment.songName}">곡</p>
                <p class="comment-artist" th:if="${comment.artistName}" th:text="${comment.artistName}">아티스트</p>
            </article>
        </div>

        <ul class="comment-list">
            <li class="comment-item" th:each="comment : ${post.comments}">
                <div class="comment-track">
                    <img th:src="|${base}web/img/musicnote.png|" width="12" height="14" alt="">
                    <div class="pill">
                        <span class="pill-song" th:text="${comment.songName} ?: '제목 없음'">곡</span>
                        <span class="pill-artist" th:text="${comment.artistName} ?: '아티스트 미상'">아티스트</span>
                        <button type="button" class="play play-sm" th:if="${comment.previewUrl}"
                                th:attr="data-src=${comment.previewUrl}" aria-label="음악 재생">
                            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
                            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
                        </button>
                    </div>
                </div>
                <p class="comment-content" th:if="${comment.content}" th:text="${comment.content}">댓글</p>
            </li>
        </ul>
    </section>
</main>

<p class="toast" th:if="${notice}" th:text="${notice}" role="status">안내</p>

<footer class="bottom-bar">
    <th:block th:if="${viewer == null}">
        <a class="bottom-cta" th:href="|${base}w/login?next=/p/${post.postId}|">
            카카오로 로그인하고 <strong>노래 남기기</strong>
        </a>
    </th:block>
    <th:block th:if="${viewer != null and post.completed}">
        <p class="bottom-note">플레이리스트가 완성된 사연이에요.</p>
    </th:block>
    <th:block th:if="${viewer != null and !post.completed and !viewer.onboarded}">
        <a class="bottom-cta" th:href="|${base}w/signup|">가입을 마치고 <strong>노래 남기기</strong></a>
    </th:block>
    <form class="comment-bar" method="post" th:if="${viewer != null and !post.completed and viewer.onboarded}"
          th:action="|${base}w/p/${post.postId}/comments|" data-music-form>
        <th:block th:replace="~{web/fragments/layout :: musicFields(${commentForm.music})}"></th:block>
        <div class="music-chip" data-music-chip hidden>
            <img th:src="|${base}web/img/musicnote.png|" width="11" height="13" alt="">
            <span data-music-chip-label></span>
            <button type="button" class="chip-clear" data-music-clear aria-label="첨부 음악 삭제">
                <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                    <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
        <div class="comment-row">
            <button type="button" class="icon-button" data-music-open aria-label="노래 검색">
                <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
                    <circle cx="12" cy="12" r="10.5"/>
                    <path d="M12 7.5v9M7.5 12h9" stroke="#F5F4F0" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <textarea name="content" rows="1" th:maxlength="${contentMaxLength}" aria-label="댓글"
                      placeholder="사연과 관련된 노래와 글을 추가해보세요."></textarea>
            <button type="submit" class="icon-button send-button" aria-label="댓글 작성" data-music-submit disabled>
                <img th:src="|${base}web/img/send.png|" width="29" height="19" alt="">
            </button>
        </div>
    </form>
</footer>

<th:block th:if="${viewer != null and !post.completed and viewer.onboarded}">
    <div th:replace="~{web/fragments/layout :: musicSheet}"></div>
</th:block>

<audio id="player" preload="none"></audio>
<script th:src="|${base}web/web.js|" defer></script>
<script th:src="|${base}web/music-picker.js|" defer></script>
</body>
</html>
