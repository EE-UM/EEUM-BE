<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{web/fragments/layout :: assets}"></th:block>
    <title>사연 쓰기 · 이음</title>
    <meta name="robots" content="noindex">
</head>
<body>
<th:block th:replace="~{web/fragments/layout :: topbar}"></th:block>

<main class="page write-page">
    <form method="post" th:action="|${base}w/write|" data-music-form data-write-form>
        <th:block th:replace="~{web/fragments/layout :: musicFields(${form.music})}"></th:block>

        <div class="write-music">
            <span class="write-music-label" data-music-chip-label data-placeholder="사연에 어울리는 노래를 골라 주세요"
                  th:text="${!#strings.isEmpty(form.music?.songName)} ? |${form.music.songName} · ${form.music.artistName}| : '사연에 어울리는 노래를 골라 주세요'">노래</span>
            <button type="button" class="music-circle" data-music-open aria-label="노래 고르기">
                <img data-music-art alt="" th:src="${form.music?.artworkUrl}"
                     th:hidden="${#strings.isEmpty(form.music?.artworkUrl)}">
                <svg class="music-circle-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2" stroke="currentColor" stroke-width="2"
                          stroke-linecap="round"/>
                </svg>
                <span class="music-circle-plus" aria-hidden="true">+</span>
            </button>
        </div>

        <div class="write-card">
            <input class="write-title" name="title" type="text" th:value="${form.title}"
                   th:maxlength="${titleMaxLength}" placeholder="사연의 제목을 작성해 주세요" aria-label="제목" required>
            <textarea class="write-content" name="content" th:maxlength="${contentMaxLength}"
                      th:text="${form.content}" aria-label="사연"
                      placeholder="200자 이내로 자유롭게 공유하고싶은 사연을 작성해주세요" data-counter-source></textarea>
        </div>
        <p class="write-counter"><span data-counter>0</span>/<span th:text="${contentMaxLength}">200</span></p>

        <p class="form-error" th:if="${error}" th:text="${error}" role="alert">오류</p>

        <div class="write-submit">
            <button type="button" class="primary-button" data-completion-open>share</button>
        </div>

        <!-- 마감 방식 시트 (앱 CompletionSheet) -->
        <div class="sheet" data-completion-sheet hidden>
            <div class="sheet-backdrop" data-sheet-close></div>
            <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="completion-title">
                <div class="sheet-handle" aria-hidden="true"></div>
                <h2 class="sheet-title" id="completion-title">설정</h2>

                <label class="completion-option">
                    <input type="radio" name="completionType" value="AUTO_COMPLETION"
                           th:checked="${form.completionType == null or form.completionType.name() == 'AUTO_COMPLETION'}">
                    <span class="completion-name">플레이리스트 자동 완료</span>
                </label>
                <p class="completion-desc">추가되는 댓글 및 음악 수를 설정하면<br>자동으로 플레이리스트가 완료처리됩니다.</p>
                <div class="completion-limit">
                    <label for="commentCountLimit">최대 댓글 갯수</label>
                    <select id="commentCountLimit" name="commentCountLimit" data-limit-select>
                        <option th:each="option : ${limitOptions}" th:value="${option}"
                                th:text="|${option}개|"
                                th:selected="${form.commentCountLimit == option}">20개
                        </option>
                    </select>
                </div>

                <label class="completion-option">
                    <input type="radio" name="completionType" value="MANUAL_COMPLETION"
                           th:checked="${form.completionType != null and form.completionType.name() == 'MANUAL_COMPLETION'}">
                    <span class="completion-name">수동 완료 처리</span>
                </label>
                <p class="completion-desc">inbox 내 작성한 사연에서 직접<br>플레이리스트를 완료할 수 있습니다.</p>

                <button type="submit" class="primary-button">공유하기</button>
            </div>
        </div>
    </form>
</main>

<div th:replace="~{web/fragments/layout :: musicSheet}"></div>

<audio id="player" preload="none"></audio>
<script th:src="|${base}web/web.js|" defer></script>
<script th:src="|${base}web/music-picker.js|" defer></script>
</body>
</html>
