server {
    listen 80;
    server_name eeum.site;

    # 관리자 페이지는 세션 쿠키를 쓰므로 평문 HTTP 로 받지 않고 HTTPS 로 보낸다.
    location ~ ^/(dev/|prod/)?admin {
        return 301 https://$host$request_uri;
    }

    # dev 환경 (예: 포트 8081)
    location /dev/ {
        limit_req zone=dev_limit burst=50 nodelay;
    limit_req_status 429;
    proxy_pass http://dev_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        rewrite ^/dev(/.*)$ $1 break;
    }

    # prod 환경 (예: 포트 8080)
    location /prod/ {
    limit_req zone=prod_limit burst=20 nodelay;
    limit_req_status 429;
        proxy_pass http://prod_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        rewrite ^/prod(/.*)$ $1 break;
    }

    # 기본 경로는 prod로 연결
    location / {
    limit_req zone=prod_limit burst=20 nodelay;
    limit_req_status 429;
        proxy_pass http://prod_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl http2;
    server_name eeum.site;

    ssl_certificate     /etc/letsencrypt/live/eeum.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eeum.site/privkey.pem;

    # 관리자 페이지 (/admin/**, 카카오 로그인 + 세션 + CSRF).
    # 앱이 /admin 요청에 한해 ForwardedHeaderFilter 로 X-Forwarded-* 를 신뢰하므로(https 콜백 주소, /dev 접두어,
    # 감사 로그 IP), 클라이언트가 보낸 값이 섞이지 않도록 여기서 모두 덮어쓴다. X-Forwarded-For 도 append 하지 않는다.
    location ^~ /dev/admin {
        limit_req zone=dev_limit burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://dev_backend;
        rewrite ^/dev(/.*)$ $1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /dev;
        proxy_set_header Forwarded "";
    }

    location ^~ /prod/admin {
        limit_req zone=prod_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://prod_backend;
        rewrite ^/prod(/.*)$ $1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /prod;
        proxy_set_header Forwarded "";
    }

    location ^~ /admin {
        limit_req zone=prod_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://prod_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
    }

    location /dev/ {
        limit_req zone=dev_limit burst=50 nodelay;
        limit_req_status 429;
    proxy_pass http://dev_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        rewrite ^/dev(/.*)$ $1 break;
    }

    location /prod/ {
    limit_req zone=prod_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://prod_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        rewrite ^/prod(/.*)$ $1 break;
    }

    location / {
    limit_req zone=prod_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://prod_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
